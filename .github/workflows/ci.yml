# Governing: ADR-0001 (two-tier NMS data ingestion) — ingestion is a
# developer-local step and cannot run in CI, so every job here must pass on a
# machine with no No Man's Sky install. Tests that need game files gate on an
# environment variable and skip when it is unset; CI never sets it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"
  NODE_VERSION: "24"

# Each job is independent so a formatting failure and a test failure surface
# separately rather than one masking the other.
jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w ."
            exit 1
          fi

  vet:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        # Pinned to the 0.8.0 release candidate deliberately: it is the only
        # published staticcheck built against go1.26, which go.mod requires.
        # The 0.6.x line (built with go1.24) and 0.7.x (go1.25) both refuse to
        # analyze this module. Move to v0.8.0 final once it ships.
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1 ./...

  test:
    name: Tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test -race
        # NMS_PCBANKS is deliberately unset: tests requiring a real game
        # install must skip, not fail. See SPEC-0003 REQ "Real-Archive
        # Verification".
        run: go test -race ./...

  # ---------------------------------------------------------------------
  # Frontend (web/). SPEC-0005 is purely frontend, so the backend quality
  # jobs above do not cover it — these are its equivalents. Each is
  # independent for the same reason the Go jobs are: a formatting failure
  # and a type error should surface separately rather than one masking the
  # other.
  #
  # These deliberately carry no path filter. Gating them on web/ having
  # changed would save one cheap install on Go-only changes, at the cost of
  # a check that can silently stop running.
  # ---------------------------------------------------------------------

  web-format:
    name: Frontend formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: prettier --check
        run: npm run format:check

  web-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: tsc
        run: npm run typecheck

  web-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: stylelint
        # Enforces SPEC-0005 REQ "Token Discipline" (no colour literal
        # outside the token file) and REQ "Component Styling Discipline"
        # (no inset box-shadow) mechanically rather than by review.
        run: npm run lint:css
      - name: colour literals outside the token file
        # Covers .ts/.tsx, where an inline style attribute can carry a
        # literal and stylelint does not look.
        run: npm run check:tokens

  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff below needs the base commit present, not just the tip.
          fetch-depth: 0
      - id: filter
        env:
          # Empty on a push event; the branch below keys off that.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Push to main always runs everything. A push has no single obvious
          # base to diff against — a force-push or a new branch leaves
          # github.event.before unusable — and main is the branch whose green
          # is load-bearing, so it is not the place to economise.
          if [ -z "${BASE_SHA:-}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "push event — running everything"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "changed files:"
          echo "$changed" | sed 's/^/  /'

          # `code` is true when ANY changed file falls outside the documentation
          # set. The test is deliberately this way round: a path nobody thought
          # about counts as code and runs the suite. Adding a directory here is
          # a decision to stop testing changes to it.
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|[^/]+\.md$|LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "-> code changed, running the frontend suite"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "-> documentation only, skipping the frontend suite"
          fi

  web-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    # The frontend suite plus its mutation check is the long pole in CI —
    # 8-11 minutes against 15-40s for every other job — and a change confined
    # to docs/ cannot alter its outcome. Gated on `changes` rather than a
    # workflow-level paths-ignore: a job skipped by `if` still reports a
    # conclusion, which a required status check accepts, whereas a workflow
    # that never triggers leaves that check pending and the pull request
    # unmergeable.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          # web/package.json's predev and prebuild hooks compile cmd/planner
          # for js/wasm — the frontend cannot be served or built without the
          # Go toolchain that produces the module and its loader shim.
          go-version: ${{ env.GO_VERSION }}
      - run: npm ci
      - name: install chromium
        # --with-deps pulls the shared libraries the headless build needs;
        # only chromium, because the suite asserts computed styles and pixels
        # against one engine and running it against three would be asserting
        # three different correct answers.
        run: npx playwright install --with-deps chromium
      - name: playwright
        run: npm test
      - name: the tests fail against a broken stylesheet
        # SPEC-0005 REQ "Token Discipline", REQ "Component Styling Discipline".
        # A green suite says the stylesheet is not broken in the ways the suite
        # can see. This breaks it eleven ways and requires the suite to go red
        # each time — which is the only thing that distinguishes a working
        # check from one that has quietly stopped matching anything.
        run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  web-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: npm ci
      - name: vite build
        run: npm run build
      - name: no inline script in the built HTML
        # SPEC-0005 Security Requirements → Security Headers forbids inline
        # script. The CSP is only honest if the build output can live under
        # it, so this asserts the output rather than the policy.
        run: |
          if grep -qE '<script[^>]*>[^<]+</script>' dist/index.html; then
            echo "dist/index.html contains an inline script, which the CSP forbids:"
            grep -nE '<script[^>]*>[^<]+</script>' dist/index.html
            exit 1
          fi
          echo "No inline script in the built HTML."
